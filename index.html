<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Sin Complicarse AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    background:#080b14;
    color:white;
    min-height:100vh;
}
header{
    padding:25px 8%;
    border-bottom:1px solid #202638;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo{font-size:24px;font-weight:bold}
.logo span{color:#19cfff}
.badge{
    background:#111827;
    padding:10px 16px;
    border-radius:20px;
    color:#19cfff;
}
main{
    max-width:900px;
    margin:60px auto;
    padding:20px;
    text-align:center;
}
h1{
    font-size:48px;
    margin-bottom:15px;
}
h1 span{color:#19cfff}
.subtitle{
    color:#9ca3af;
    font-size:18px;
    margin-bottom:40px;
}
.box{
    background:#101522;
    border:1px solid #273044;
    border-radius:20px;
    padding:25px;
    text-align:left;
}
label{
    display:block;
    margin-bottom:10px;
    font-weight:bold;
}
textarea{
    width:100%;
    height:150px;
    background:#080b14;
    color:white;
    border:1px solid #30394d;
    border-radius:12px;
    padding:15px;
    font-size:16px;
    resize:none;
    outline:none;
}
.options{
    display:flex;
    gap:15px;
    margin-top:20px;
}
select{
    flex:1;
    background:#080b14;
    color:white;
    border:1px solid #30394d;
    border-radius:10px;
    padding:14px;
}
button{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:0;
    border-radius:12px;
    background:#19cfff;
    color:#061018;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{opacity:.85}
#status{
    text-align:center;
    margin-top:20px;
    color:#19cfff;
}
</style>
</head>

<body>

<header>
    <div class="logo">🤖 IA <span>SIN COMPLICARSE</span></div>
    <div class="badge">AI Studio</div>
</header>

<main>

<h1>Crea con <span>IA</span></h1>

<p class="subtitle">
Genera imágenes y videos con inteligencia artificial de forma sencilla.
</p>

<div class="box">

<label>¿Qué quieres crear?</label>

<textarea id="prompt" placeholder="Ejemplo: Un motorista dominicano contando un chiste frente a una motocicleta..."></textarea>

<div class="options">

<select id="tipo">
    <option>🎬 Video</option>
    <option>🖼️ Imagen</option>
</select>

<select id="formato">
    <option>📱 9:16 Vertical</option>
    <option>🖥️ 16:9 Horizontal</option>
    <option>⬜ 1:1 Cuadrado</option>
</select>

<select id="duracion">
    <option>5 segundos</option>
    <option>10 segundos</option>
    <option>15 segundos</option>
    <option>30 segundos</option>
</select>

</div>

<button onclick="generar()">🚀 GENERAR</button>

<div id="status"></div>

</div>

</main>

<script>
function generar(){
    const prompt=document.getElementById("prompt").value;
    const status=document.getElementById("status");

    if(!prompt){
        status.innerText="⚠️ Escribe primero lo que quieres crear.";
        return;
    }

    status.innerText="🤖 Preparando tu creación...";

    setTimeout(()=>{
        status.innerText="✅ ¡Sistema funcionando! Próximamente conectaremos el modelo de IA.";
    },1500);
}
</script>

</body>
</html>
